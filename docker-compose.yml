services:
  backend:
    build: ./backend
    ports:
      - "${SUBLYNT_API_PORT:-8000}:8000"
    environment:
      SUBLYNT_DATABASE_URL: ${SUBLYNT_DATABASE_URL:-sqlite:////app/data/sublynt.db}
      SUBLYNT_DATA_DIR: ${SUBLYNT_DATA_DIR:-/app/data/files}
      SUBLYNT_MAX_UPLOAD_BYTES: ${SUBLYNT_MAX_UPLOAD_BYTES:-5242880}
      SUBLYNT_RETENTION_HOURS: ${SUBLYNT_RETENTION_HOURS:-24}
      SUBLYNT_CORS_ORIGINS: ${SUBLYNT_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - sublynt-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "${SUBLYNT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sublynt-data:
